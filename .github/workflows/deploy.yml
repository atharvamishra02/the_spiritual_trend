name: VPS Production Docker CI/CD Deploy Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./Backend
        push: true
        tags: ghcr.io/atharvamishra02/the_spiritual_trend/backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./front
        push: true
        tags: ghcr.io/atharvamishra02/the_spiritual_trend/frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Admin Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./admin/frontend
        push: true
        tags: ghcr.io/atharvamishra02/the_spiritual_trend/admin-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to VPS Server via SSH Execution
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        script_stop: false
        script: |
          set -e
          echo "========================================================================="
          echo "🚀 STARTING THE SPIRITUAL TREND AUTO-DEPLOY PIPELINE ON VPS SERVER"
          echo "========================================================================="
          
          # Run diagnostic checks
          echo "=== 📊 VPS DIAGNOSTICS ==="
          df -h || true
          echo "=========================="
          
          # 1. DEFINE PATH OR RETRIEVE IN TARGET DIRECTORY
          TARGET_DIR="/var/www/the_spiritual_trend"
          
          # Disable interactive git prompt so it fails fast
          export GIT_TERMINAL_PROMPT=0
          
          # Configure Git to force IPv4 and timeout quickly on hung connections
          git config --global http.ipv4 true || true
          git config --global http.lowSpeedLimit 1000 || true
          git config --global http.lowSpeedTime 30 || true
          
          if [ ! -d "$TARGET_DIR/.git" ]; then
            echo "⚠️  Git repository not found at $TARGET_DIR. Initializing repository..."
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"
            git init
            git remote add origin https://ghfast.top/https://github.com/${{ github.repository }}.git
          else
            cd "$TARGET_DIR"
            echo "🔄 Updating Git remote URL with Proxy URL..."
            git remote set-url origin https://ghfast.top/https://github.com/${{ github.repository }}.git
          fi
          
          # 2. DISCARD UNTRACKED FILES OR LOCAL ACCIDENTAL EDITS & FETCH LATEST COMMIT
          echo "📥 Fetching latest commits from Git branch 'main'..."
          git fetch --all
          git reset --hard origin/main
          
          # 3. LOG IN TO GHCR AND DEPLOY
          echo "🔑 Logging in to GHCR on VPS..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          echo "📥 Pulling latest pre-built images from GHCR..."
          docker compose pull
          
          echo "🏗️  Rebuilding and launching updated containers in detached daemon mode..."
          docker compose down
          docker compose up -d
          
          # 4. POST-DEPLOYMENT CLEANUP (Pruning unused dangling build cache & old layers)
          echo "🧼 Cleaning up old unused Docker images..."
          docker image prune -af
          
          echo "========================================================================="
          echo "🎉 THE SPIRITUAL TREND DEPLOYED SUCCESSFULLY."
          echo "========================================================================="
